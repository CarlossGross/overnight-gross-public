<title>The Gross Overnight</title>

<style>
/* Password screen. The real page is inside, encrypted (AES-256-GCM); it opens here, in the browser, with the right password. */
:root { --bg: #fbfaf7; --tx: #17181c; --tx2: #5a5e66; --ln: #d9d5ca; --err: #b3261e; --mark: #b85c00;
  --serif: ui-serif, "Iowan Old Style", "Charter", Georgia, serif; --sans: system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg: #121317; --tx: #ebecef; --tx2: #a2a6ae; --ln: #33363d; --err: #f2968c; --mark: #f0a35c; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 16px/1.5 var(--sans); display: grid; place-items: center; padding: 24px 16px; overflow: hidden; }
.scene { width: min(100%, 380px); display: grid; justify-items: center; gap: 18px; text-align: center; transition: opacity .45s ease, transform .6s cubic-bezier(.6, 0, .3, 1); }
.moon { width: 110px; height: 110px; transition: transform .8s cubic-bezier(.6, 0, .3, 1), opacity .6s; }
.moon .body { fill: var(--tx); } .moon .star { fill: var(--mark); transform-origin: 74px 26px; }
.sub { font: 500 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--tx2); }
h1 { font: 700 28px/1.1 var(--serif); margin: 4px 0 0; letter-spacing: -.01em; }
form { width: 100%; display: grid; gap: 10px; margin-top: 6px; }
.row { display: flex; gap: 8px; }
input[type=password] { flex: 1; min-width: 0; font: 500 16px var(--mono); padding: 11px 12px; border: 1px solid var(--ln); border-radius: 6px; background: var(--bg); color: var(--tx); outline: none; }
input[type=password]:focus { border-color: var(--tx); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tx) 12%, transparent); }
button { font: 600 15px var(--sans); padding: 0 18px; border: 0; border-radius: 6px; background: var(--tx); color: var(--bg); cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
label { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13.5px; color: var(--tx2); cursor: pointer; }
.msg { min-height: 20px; font: 12.5px var(--mono); color: var(--tx2); }
.msg.err { color: var(--err); }
.foot { font: 11px var(--mono); color: var(--tx2); opacity: .8; }
.wrong form { animation: shake .42s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.working .star { animation: twinkle 1s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(1.6); opacity: .5; } }
.opening .moon { transform: scale(12) rotate(-20deg); opacity: 0; }
.opening .scene { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .scene, .moon { transition: none; } .working .star, .wrong form { animation: none; } }
</style>
</head>

  <div><h1>The Gross Overnight</h1></div>
